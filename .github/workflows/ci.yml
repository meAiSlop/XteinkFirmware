name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: g++ -std=c++20 -Iinclude src/main.cpp src/ha_bridge.cpp -o xteink_app
      - name: Build unit tests
        run: g++ -std=c++20 -Iinclude tests/test_ha_bridge.cpp src/ha_bridge.cpp -o test_ha_bridge
      - name: Run unit tests
        run: ./test_ha_bridge

  integration-ha:
    runs-on: ubuntu-latest
    services:
      homeassistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        ports:
          - 8123:8123
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder integration test
        run: echo "Add authenticated HA API integration test here."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Build metadata
        run: |
          echo "commit=${GITHUB_SHA}" > build-metadata.txt
          sha256sum src/main.cpp src/ha_bridge.cpp include/ha_bridge.hpp >> build-metadata.txt
